version: 7
protocol: file_driven_with_durable_runtime
maximum_iterations: 5

harness_enforcement:
  phase_runner: runtime/phase_runner.py
  model_invocation_adapter: runtime.phase_runner.ModelInvocationAdapter
  policy: config/harness_policy.yaml
  unknown_model_or_risk: FULL
  evaluator_gate_verifiers_required: true
  browser_required_gate_cannot_be_skipped: true
  candidate_profile_binding_required_for_schema_v2: true
  benchmark_scope: external_test_project_only

runtime:
  version: 1
  rules: config/runtime.yaml
  session_store: sqlite3
  orchestrator_is_agent: false
  core_roles:
    - planner
    - generator
    - evaluator
  project_state_projection_schema: 7
  legacy_first_read_is_read_only: true
  state_commit_requires:
    - valid_worker_lease
    - expected_revision
    - compare_and_swap
  wait_states_never_launch_role: true

evaluation_protocol:
  version: 1
  rules: config/evaluation_protocol.yaml
  issue_schema: config/schemas/evaluation_issue_v1.schema.json
  response_schema: config/schemas/generator_response_v1.schema.json
  issue_directory: evaluation/issues
  response_directory: memory/handoffs/responses
  markdown_reports_preserved: true
  state_commit_order:
    - validate_all_outputs
    - stage_issue_package
    - stage_markdown_report
    - commit_artifacts
    - commit_project_state
  route_priority:
    - SYSTEM_OR_USER
    - USER
    - PLANNER
    - GENERATOR
    - ACCEPTED

evidence_protocol:
  version: 1
  rules: config/evaluation_gates.yaml
  manifest_schema: config/schemas/evidence_manifest_v1.schema.json
  manifest_directory: evaluation/evidence/evaluation-<nnn>
  gate_order:
    - GATE-DELIVERY
    - GATE-BUILD
    - GATE-TESTS
    - GATE-REQUIREMENTS
    - GATE-REGRESSION
    - GATE-NON_FUNCTIONAL
    - GATE-EVIDENCE
  command_execution:
    shell: false
    profile_allowlist_required: true
    project_cwd_only: true
    timeout_required: true
    output_limit_required: true
  protected_snapshot:
    algorithm: sha256
    git_required: false
  manifest_committed_before_project_state: true

evaluator_independence:
  upgrade_id: E1
  name: Evaluator Independence Hardening
  policy: config/evaluation_independence.yaml
  fresh_invocation_required: true
  evaluator_context_type: EVALUATOR_INDEPENDENT
  generator_claims_are_evidence: false
  required_provenance:
    - EVALUATOR_REPRODUCED
    - RUNTIME_VERIFIED
  deterministic_pass_gate_required: true

controlled_retry:
  version: 1
  rules: config/retry_governance.yaml
  metrics_schema: config/schemas/iteration_metrics_v1.schema.json
  decision_summary_schema: config/schemas/decision_summary_v1.schema.json
  targeted_recheck_required: true
  mandatory_regression_may_be_skipped: false
  stable_issue_identity: true
  progress_statuses:
    - IMPROVING
    - STABLE
    - REGRESSING
    - STALLED
    - UNKNOWN
  maximum_automatic_iterations: 5
  counter_increment_condition:
    evaluation_result: FAIL
    return_to: GENERATOR
  counter_not_incremented_for:
    - BLOCKED
    - WAITING_FOR_USER
    - PLANNER_ROUTE
  reset_requires:
    - new_approved_plan
    - new_plan_approval_record
  exhausted_status: WAITING_FOR_USER
  exhausted_next_role: null

rework_governance:
  record_schema: config/schemas/rework_v1.schema.json
  evidence_schema: config/schemas/evidence_v2.schema.json
  append_only_records: true
  counter_field: current_iteration
  counter_increment_event: evaluator_commits_rework_route
  reject_replayed_record: true
  maximum_retries: 5
  exhausted_status: WAITING_FOR_USER
  exhausted_reason: maximum_iterations_reached
  deterministic_routes:
    implementation_issue: generator
    testing_issue: generator
    product_scope_issue: planner
    requirement_issue: first_ask_intake
  compatibility_status: legacy_v1

design_exploration:
  required_concept_count: 3
  maximum_generation_attempts: 2
  default_preview_mode: direction_comparison
  new_projects_default: direction_comparison
  stages:
    direction_comparison:
      concept_count: 3
      required_files_per_concept:
        - concept.md
      shared_preview_files:
        - comparison.html
        - comparison.css
      browser_qa: batched_smoke_only
      on_selection: selected_prototype
    selected_prototype:
      concept_count: 1
      concept_directory: selected_concept
      required_files:
        - concept.md
        - preview.html
        - preview.css
      browser_qa: full
      requires_explicit_confirmation: true
    legacy_full:
      compatibility_only: true
      not_for_new_projects: true
      concept_count: 3
      required_files_per_concept:
        - concept.md
        - preview.html
        - preview.css
      browser_qa: compatibility_only
  # 历史配置键保留用于兼容读取；只适用于 legacy_full，不参与新项目路由。
  required_concept_files:
    compatibility_only: true
    applies_to: legacy_full
    files:
      - concept.md
      - preview.html
      - preview.css
  reference_guided:
    enabled: true
    active_input: active_reference_synthesis
    design_relevant_domains:
      - information_architecture
      - navigation
      - interaction
      - layout
      - visual_style
      - components
      - design_tokens
      - motion
    strategies:
      - reference_faithful
      - reference_adapted
      - reference_inspired
    required_concept_metadata:
      - Reference Strategy
      - Referenced Decisions
      - Adopted Decisions
      - Adapted Decisions
      - Not Used Decisions
      - Explicit Exclusions
      - Original Design Decisions

change_request:
  version: 1
  rules: config/change_request.yaml
  module: change_request
  request_schema: config/schemas/change_request_v1.schema.json
  event_schema: config/schemas/change_request_event_v1.schema.json
  impact_analysis_schema: config/schemas/change_impact_analysis_v1.schema.json
  approval_schema: config/schemas/change_approval_v1.schema.json
  baseline_schema: config/schemas/change_baseline_v1.schema.json
  handoff_schema: config/schemas/change_handoff_v1.schema.json
  evaluation_schema: config/schemas/change_evaluation_v1.schema.json
  release_schema: config/schemas/release_v1.schema.json
  single_active_request: true
  original_feedback_immutable: true
  lifecycle_events_append_only: true
  current_state_source: project.yaml
  evaluation_iteration_field: change_context.evaluation_iteration

states:
  INTAKE:
    next_role: null
    active_module: first_ask_intake
  WAITING_FOR_REQUIREMENTS:
    next_role: null
    active_module: first_ask_intake
    allowed_active_modules:
      - first_ask_intake
      - domain_research
    wait_for_user: true
  REQUIREMENT_RESEARCH:
    next_role: null
    active_module: domain_research
    wait_for_user: false
  REFERENCE_ANALYSIS:
    next_role: null
    active_module: reference_analysis
  PLANNING:
    next_role: planner
  DESIGN_EXPLORATION:
    next_role: planner
  WAITING_FOR_DESIGN_REVIEW:
    next_role: planner
    wait_for_user: true
  DESIGN_REVIEW:
    next_role: planner
    legacy_read_only: true
    migrates_to: WAITING_FOR_DESIGN_REVIEW
  WAITING_FOR_PRODUCT_REVIEW:
    next_role: planner
    wait_for_user: true
  WAITING_FOR_PLAN_REVIEW:
    next_role: planner
    wait_for_user: true
  PRODUCT_REVIEW:
    next_role: planner
    legacy_read_only: true
    migrates_to: WAITING_FOR_PRODUCT_REVIEW
  PLANNING_REVISION:
    next_role: planner
  APPROVED_FOR_IMPLEMENTATION:
    next_role: generator
  PLANNING_COMPLETE:
    next_role: generator
    legacy_read_only: true
    migrates_to: APPROVED_FOR_IMPLEMENTATION
  IMPLEMENTING:
    next_role: generator
  EVALUATING:
    next_role: evaluator
  CHANGE_REQUESTED:
    next_role: planner
  WAITING_FOR_CHANGE_APPROVAL:
    transition_actor: generator
    next_role: planner
    wait_for_user: true
  RELEASE_READY:
    next_role: evaluator
  WAITING_FOR_USER:
    next_role: null
  BLOCKED:
    next_role: null
  ACCEPTED:
    transition_actor: change_request
    next_role: null
  ARCHIVED:
    next_role: null

failure_routing:
  implementation_issue:
    status: IMPLEMENTING
    next_role: generator
  testing_issue:
    status: IMPLEMENTING
    next_role: generator
  requirement_issue:
    status: INTAKE
    next_role: null
    active_module: first_ask_intake
  incomplete_requirements:
    status: WAITING_FOR_REQUIREMENTS
    next_role: null
    active_module: first_ask_intake
  requirement_conflict:
    status: WAITING_FOR_REQUIREMENTS
    next_role: null
    active_module: first_ask_intake
  reference_analysis_failed:
    status: WAITING_FOR_USER
    next_role: null
  reference_analysis_blocked:
    status: BLOCKED
    next_role: null
  product_scope_issue:
    status: PLANNING
    next_role: planner
  product_revision_requested:
    status: PLANNING_REVISION
    next_role: planner
  design_revision_requested:
    status: DESIGN_EXPLORATION
    next_role: planner
  design_generation_invalid:
    status: DESIGN_EXPLORATION
    next_role: planner
  design_generation_attempts_exhausted:
    status: WAITING_FOR_USER
    next_role: null
  new_design_directions_requested:
    status: DESIGN_EXPLORATION
    next_role: planner
  design_direction_selected:
    status: PLANNING_REVISION
    next_role: planner
  design_modification_selected:
    status: PLANNING_REVISION
    next_role: planner
  design_blend_selected:
    status: PLANNING_REVISION
    next_role: planner
  design_previous_direction_restored:
    status: PLANNING_REVISION
    next_role: planner
  all_design_directions_rejected:
    status: DESIGN_EXPLORATION
    next_role: planner
  design_feedback_discussion:
    status: WAITING_FOR_DESIGN_REVIEW
    next_role: planner
  design_feedback_ambiguous:
    status: WAITING_FOR_DESIGN_REVIEW
    next_role: planner
  design_feedback_conflicting:
    status: WAITING_FOR_DESIGN_REVIEW
    next_role: planner
  design_exploration_skipped:
    status: WAITING_FOR_PRODUCT_REVIEW
    next_role: planner
  product_proposal_ready:
    status: WAITING_FOR_PRODUCT_REVIEW
    next_role: planner
  product_approved:
    status: WAITING_FOR_PLAN_REVIEW
    next_role: planner
  plan_approved:
    status: APPROVED_FOR_IMPLEMENTATION
    next_role: generator
  plan_revision_requested:
    status: PLANNING_REVISION
    next_role: planner
  product_approval_revoked:
    status: PLANNING_REVISION
    next_role: planner
  plan_approval_revoked:
    status: PLANNING_REVISION
    next_role: planner
  implementation_scope_change_requested:
    status: WAITING_FOR_USER
    next_role: null
  ambiguous_requirement:
    status: WAITING_FOR_USER
    next_role: null
  environment_blocked:
    status: BLOCKED
    next_role: null
  maximum_iterations_reached:
    status: WAITING_FOR_USER
    next_role: null
  completed_project_change_requested:
    status: CHANGE_REQUESTED
    next_role: planner
  change_impact_analysis_ready:
    status: WAITING_FOR_CHANGE_APPROVAL
    next_role: planner
  change_approved:
    status: IMPLEMENTING
    next_role: generator
  change_evaluation_passed:
    status: RELEASE_READY
    next_role: evaluator
  change_cancelled:
    restore_previous_project_status: true
    next_role: null

environment_block_recovery:
  windows_symlink_privilege_missing:
    category: acceptance_environment
    blocked_status: BLOCKED
    blocked_next_role: null
    resume_status: EVALUATING
    resume_next_role: evaluator
    required_checks:
      - test_directory_symlink_escape_is_rejected
      - test_file_symlink_escape_is_rejected
    resume_requires:
      - directory_symlink_creation_available
      - file_symlink_creation_available
    direct_pass_forbidden: true

legacy_state_aliases:
  DESIGN_REVIEW: WAITING_FOR_DESIGN_REVIEW
  PRODUCT_REVIEW: WAITING_FOR_PRODUCT_REVIEW
  PLANNING_COMPLETE: APPROVED_FOR_IMPLEMENTATION

legacy_state_policy: read_only_require_migration

state_transitions:
  INTAKE: ["INTAKE", "WAITING_FOR_REQUIREMENTS", "REQUIREMENT_RESEARCH", "REFERENCE_ANALYSIS", "PLANNING", "WAITING_FOR_USER", "BLOCKED"]
  WAITING_FOR_REQUIREMENTS: ["INTAKE", "REQUIREMENT_RESEARCH", "REFERENCE_ANALYSIS", "PLANNING", "WAITING_FOR_USER", "BLOCKED"]
  REQUIREMENT_RESEARCH: ["REQUIREMENT_RESEARCH", "INTAKE", "WAITING_FOR_USER", "BLOCKED"]
  REFERENCE_ANALYSIS: ["REFERENCE_ANALYSIS", "PLANNING", "WAITING_FOR_USER", "BLOCKED"]
  PLANNING: ["PLANNING", "DESIGN_EXPLORATION", "WAITING_FOR_PRODUCT_REVIEW", "WAITING_FOR_PLAN_REVIEW", "WAITING_FOR_USER", "BLOCKED"]
  DESIGN_EXPLORATION: ["DESIGN_EXPLORATION", "WAITING_FOR_DESIGN_REVIEW", "WAITING_FOR_USER", "BLOCKED"]
  WAITING_FOR_DESIGN_REVIEW: ["DESIGN_EXPLORATION", "PLANNING_REVISION", "WAITING_FOR_USER", "BLOCKED"]
  WAITING_FOR_PRODUCT_REVIEW: ["PLANNING", "WAITING_FOR_PLAN_REVIEW", "PLANNING_REVISION", "WAITING_FOR_USER", "BLOCKED"]
  WAITING_FOR_PLAN_REVIEW: ["PLANNING_REVISION", "APPROVED_FOR_IMPLEMENTATION", "WAITING_FOR_USER", "BLOCKED"]
  PLANNING_REVISION: ["PLANNING_REVISION", "DESIGN_EXPLORATION", "WAITING_FOR_PRODUCT_REVIEW", "WAITING_FOR_PLAN_REVIEW", "WAITING_FOR_USER", "BLOCKED"]
  APPROVED_FOR_IMPLEMENTATION: ["IMPLEMENTING", "WAITING_FOR_USER", "BLOCKED"]
  IMPLEMENTING: ["IMPLEMENTING", "EVALUATING", "WAITING_FOR_USER", "BLOCKED"]
  EVALUATING: ["IMPLEMENTING", "EVALUATING", "RELEASE_READY", "ACCEPTED", "WAITING_FOR_USER", "BLOCKED"]
  CHANGE_REQUESTED: ["WAITING_FOR_CHANGE_APPROVAL", "WAITING_FOR_USER", "BLOCKED"]
  WAITING_FOR_CHANGE_APPROVAL: ["IMPLEMENTING", "WAITING_FOR_USER", "BLOCKED"]
  RELEASE_READY: ["ACCEPTED", "WAITING_FOR_USER", "BLOCKED"]
  WAITING_FOR_USER: ["INTAKE", "REFERENCE_ANALYSIS", "PLANNING", "PLANNING_REVISION", "IMPLEMENTING", "EVALUATING", "CHANGE_REQUESTED", "ARCHIVED"]
  BLOCKED: ["WAITING_FOR_USER", "REFERENCE_ANALYSIS", "PLANNING", "IMPLEMENTING", "EVALUATING", "ARCHIVED"]
  ACCEPTED: ["CHANGE_REQUESTED", "ARCHIVED"]
  ARCHIVED: []

state_guards:
  INTAKE:
    required_active_module: first_ask_intake
    allowed_next_roles:
      - null
  WAITING_FOR_REQUIREMENTS:
    halt_until_user_input: true
    allowed_next_roles:
      - null
  REQUIREMENT_RESEARCH:
    required_active_module: domain_research
    required_research_status:
      - planned
      - running
    allowed_next_roles:
      - null
  REFERENCE_ANALYSIS:
    required_requirements_status: sufficient_for_planning
    required_active_requirements: true
    required_reference_status: provided_or_ready
    required_reference_analysis_status: running
    required_active_module: reference_analysis
    allowed_next_roles:
      - null
    active_plan_must_be_null: true
  PLANNING:
    required_requirements_status: sufficient_for_planning
    required_active_requirements: true
  DESIGN_EXPLORATION:
    required_requirements_status: sufficient_for_planning
    required_active_requirements: true
    required_active_proposal: true
    required_design_exploration: true
    active_plan_must_be_null: true
  WAITING_FOR_DESIGN_REVIEW:
    halt_until_user_input: true
    required_complete_preview_round: true
    required_concept_count: 3  # direction_comparison 的默认值
    required_concept_count_by_mode:
      direction_comparison: 3
      selected_prototype: 1
      legacy_full: 3
    active_plan_must_be_null: true
  WAITING_FOR_PRODUCT_REVIEW:
    halt_until_user_input: true
    active_plan_must_be_null: true
  WAITING_FOR_PLAN_REVIEW:
    halt_until_user_input: true
    required_user_approval_status: approved
    required_approved_proposal: true
    required_product_approval_record: true
    required_active_product_spec: true
    required_active_plan: true
    approved_plan_must_be_null: true
  APPROVED_FOR_IMPLEMENTATION:
    required_user_approval_status: approved
    required_active_requirements: true
    required_approved_proposal: true
    required_product_approval_record: true
    required_active_plan: true
    required_approved_plan: true
    required_plan_approval_record: true
