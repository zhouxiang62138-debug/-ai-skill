schema_version: 1
default_mode: FULL
known_models:
  - model_id: gpt-5
    capability_profile: general_reasoning
  - model_id: gpt-5-mini
    capability_profile: fast_reasoning
mode_limits:
  LEAN:
    context_budget_percent: 92
    max_tool_calls: 60
    max_compactions: 4
    max_elapsed_seconds: 2400
  STANDARD:
    context_budget_percent: 85
    max_tool_calls: 40
    max_compactions: 3
    max_elapsed_seconds: 1800
  FULL:
    context_budget_percent: 75
    max_tool_calls: 24
    max_compactions: 2
    max_elapsed_seconds: 1200
mandatory_gates:
  - source_chain
  - evidence
  - regression
