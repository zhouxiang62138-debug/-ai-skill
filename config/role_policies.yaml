version: 6

policy_precedence:
  write_prohibited_overrides_writes: true

modules:
  first_ask_intake:
    reads:
      - project.yaml
      - memory/requirements/
      - memory/handoffs/intake-request-*.md
    writes:
      - memory/requirements/
      - project.yaml
    prohibited:
      - code/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - artifacts/design_previews/
      - evaluation/
      - config/
      - prompts/
  change_request:
    reads:
      - project.yaml
      - change_requests/
      - releases/
      - memory/plans/
      - evaluation/reports/
      - code/
      - tests/
    writes:
      - change_requests/
      - memory/migrations/
      - project.yaml
    prohibited:
      - code/
      - tests/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - evaluation/reports/
      - config/
      - prompts/

roles:
  planner:
    reads:
      - project.yaml
      - memory/requirements/
      - memory/proposals/
      - memory/specifications/
      - memory/decisions/
      - memory/plans/
      - evaluation/reports/
      - artifacts/design_previews/
      - change_requests/
      - releases/
    writes:
      - memory/requirements/
      - memory/proposals/
      - memory/decisions/
      - memory/plans/
      - memory/specifications/
      - memory/handoffs/
      - artifacts/design_previews/
      - project.yaml
      - change_requests/
    prohibited:
      - code/
      - evaluation/reports/
    write_prohibited:
      - memory/requirements/
  generator:
    reads:
      - project.yaml
      - memory/requirements/
      - memory/plans/
      - memory/specifications/
      - memory/handoffs/
      - memory/decisions/
      - evaluation/reports/
      - evaluation/issues/
      - code/
      - artifacts/design_previews/
      - change_requests/
      - releases/
    writes:
      - code/
      - artifacts/
      - memory/handoffs/
      - memory/handoffs/responses/
      - project.yaml
      - change_requests/
    prohibited:
      - config/evaluation_rules/
      - evaluation/reports/
    write_prohibited:
      - artifacts/design_previews/
      - memory/requirements/
      - memory/proposals/
      - memory/decisions/
  evaluator:
    reads:
      - project.yaml
      - memory/plans/
      - memory/specifications/
      - memory/handoffs/
      - code/
      - artifacts/
      - evaluation/reports/
      - evaluation/issues/
      - evaluation/evidence/
      - memory/handoffs/responses/
      - change_requests/
      - releases/
    writes:
      - evaluation/reports/
      - evaluation/issues/
      - evaluation/evidence/
      - evaluation/.transactions/
      - memory/handoffs/
      - project.yaml
      - change_requests/
      - releases/
    prohibited:
      - code/
      - memory/plans/
      - config/evaluation_rules/

field_ownership:
  first_ask_intake:
    - requirements_status
    - requirements_version
    - active_requirements
    - active_interview
    - intake_round
  planner:
    - proposal_status
    - proposal_version
    - active_proposal
    - approved_proposal
    - design_exploration_required
    - exploration_trigger_reasons
    - design_review_status
    - design_preview_round
    - active_design_preview_round
    - exploration_generation_attempt
    - exploration_error_record
    - selected_design_concept
    - design_selection_record
    - design_skip_record
    - design_feedback_status
    - design_feedback_round
    - exploration_feedback_record
    - user_approval_status
    - product_approval_record
    - approval_revocation_record
    - change_request_record
    - product_spec_status
    - product_spec_version
    - active_product_spec
    - plan_status
    - plan_version
    - active_plan
    - approved_plan
    - plan_approval_status
    - plan_approval_record
    - change_impact_analysis
    - change_approval_record
    - approved_change_items
  evaluator:
    - current_iteration
    - last_evaluation
    - last_issue_package
    - iteration_metrics
    - retry_history
    - routing_disagreements
    - escalation_record
    - automatic_retry_allowed
    - iteration_sequence
  generator:
    - last_generator_response

# F8.5：外部目标只在 schema_version=5、project_type=skill_maintenance 时有效。
# 实际路径授权由 scripts/skill_maintenance.py 强制执行，不能仅依赖 Prompt。
skill_maintenance:
  planner:
    external_targets:
      - working_repository
      - installed_repository
    external_write_targets: []
  generator:
    external_targets:
      - working_repository
    external_write_targets:
      - working_repository
  evaluator:
    external_targets:
      - working_repository
      - installed_repository
    external_write_targets: []
