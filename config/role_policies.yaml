version: 7

policy_precedence:
  write_prohibited_overrides_writes: true

# F12.1：Capability 是 Role 可请求的抽象能力，不包含任何凭据内容。
capabilities:
  - filesystem.read
  - filesystem.write
  - process.execute
  - network.access
  - git.read
  - git.write
  - browser.access
  - credential.use
  - external_tool.invoke

network_policy:
  default: deny
  allowed_schemes:
    - https
  services:
    github:
      hosts:
        - api.github.com
      ports:
        - 443
      operations:
        - read
    reference_public_web:
      hosts:
        - example.com
      ports:
        - 443
      operations:
        - read
    domain_research_public_web:
      hosts:
        - example.com
      ports:
        - 443
      operations:
        - read
  roles:
    generator:
      services:
        - github
    reference_analysis:
      services:
        - reference_public_web
    first_ask_intake:
      services:
        - domain_research_public_web

external_tool_policy:
  default: deny
  tools:
    git:
      operations:
        - read
    github:
      operations:
        - read
  roles:
    generator:
      tools:
        - git
        - github

module_authorization:
  allowed_modules:
    - first_ask_intake
    - domain_research
    - reference_analysis
    - change_request
  allowed_state_sources:
    first_ask_intake:
      - INTAKE
      - WAITING_FOR_REQUIREMENTS
    domain_research:
      - REQUIREMENT_RESEARCH
    reference_analysis:
      - REFERENCE_ANALYSIS
    change_request:
      - ACCEPTED
      - ARCHIVED
      - CHANGE_REQUESTED
      - WAITING_FOR_CHANGE_APPROVAL

modules:
  runtime_orchestrator:
    reads:
      - project.yaml
      - .runtime/
      - evaluation/.transactions/
    writes:
      - .runtime/
      - project.yaml
      - evaluation/.transactions/
    prohibited:
      - code/
      - memory/requirements/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - artifacts/design_previews/
      - evaluation/reports/
      - evaluation/issues/
      - releases/
  first_ask_intake:
    capabilities:
      - filesystem.read
      - filesystem.write
      - network.access
      - browser.access
    reads:
      - project.yaml
      - memory/requirements/
      - memory/research/
      - memory/references/
      - artifacts/research/
      - artifacts/references/
      - memory/handoffs/intake-request-*.md
    writes:
      - memory/requirements/
      - memory/research/
      - memory/references/
      - artifacts/research/
      - project.yaml
    prohibited:
      - code/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - artifacts/design_previews/
      - evaluation/
      - config/
      - prompts/
  reference_analysis:
    capabilities:
      - filesystem.read
      - filesystem.write
      - browser.access
      - network.access
    reads:
      - project.yaml
      - memory/requirements/
      - memory/references/
      - artifacts/references/
      - change_requests/
    writes:
      - memory/references/
      - artifacts/references/
      - change_requests/
      - project.yaml
    prohibited:
      - code/
      - memory/requirements/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - evaluation/
      - config/
      - prompts/
    read_exceptions:
      - memory/requirements/
  domain_research:
    capabilities:
      - filesystem.read
      - filesystem.write
      - network.access
      - browser.access
    reads:
      - project.yaml
      - memory/requirements/
      - memory/research/
      - artifacts/research/
    writes:
      - memory/research/
      - artifacts/research/
      - project.yaml
    prohibited:
      - code/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - artifacts/design_previews/
      - evaluation/
      - config/
      - prompts/
  change_request:
    reads:
      - project.yaml
      - change_requests/
      - releases/
      - memory/plans/
      - evaluation/reports/
      - code/
      - tests/
    writes:
      - change_requests/
      - memory/migrations/
      - project.yaml
    prohibited:
      - code/
      - tests/
      - memory/proposals/
      - memory/specifications/
      - memory/plans/
      - evaluation/reports/
      - config/
      - prompts/

roles:
  planner:
    capabilities:
      - filesystem.read
      - filesystem.write
    reads:
      - project.yaml
      - memory/requirements/
      - memory/research/
      - memory/references/
      - memory/proposals/
      - memory/specifications/
      - memory/decisions/
      - memory/plans/
      - evaluation/reports/
      - artifacts/design_previews/
      - change_requests/
      - releases/
    writes:
      - memory/requirements/
      - memory/proposals/
      - memory/decisions/
      - memory/plans/
      - memory/specifications/
      - memory/handoffs/
      - artifacts/design_previews/
      - project.yaml
      - change_requests/
    prohibited:
      - code/
      - evaluation/reports/
    read_exceptions:
      - evaluation/reports/
    write_prohibited:
      - memory/requirements/
  generator:
    capabilities:
      - filesystem.read
      - filesystem.write
      - process.execute
      - credential.use
      - network.access
      - external_tool.invoke
    reads:
      - project.yaml
      - memory/requirements/
      - memory/plans/
      - memory/specifications/
      - memory/handoffs/
      - memory/decisions/
      - evaluation/reports/
      - evaluation/issues/
      - code/
      - artifacts/design_previews/
      - change_requests/
      - releases/
    writes:
      - code/
      - tests/
      - artifacts/
      - memory/handoffs/
      - memory/handoffs/responses/
      - project.yaml
      - change_requests/
    prohibited:
      - config/evaluation_rules/
      - evaluation/reports/
    read_exceptions:
      - evaluation/reports/
    write_prohibited:
      - artifacts/design_previews/
      - memory/requirements/
      - memory/proposals/
      - memory/decisions/
  evaluator:
    capabilities:
      - filesystem.read
      - filesystem.write
      - process.execute
      - browser.access
    reads:
      - project.yaml
      - memory/plans/
      - memory/specifications/
      - memory/handoffs/
      - code/
      - artifacts/
      - evaluation/reports/
      - evaluation/issues/
      - evaluation/evidence/
      - memory/handoffs/responses/
      - change_requests/
      - releases/
    writes:
      - evaluation/reports/
      - evaluation/issues/
      - evaluation/evidence/
      - evaluation/.transactions/
      - memory/handoffs/
      - project.yaml
      - change_requests/
      - releases/
    prohibited:
      - code/
      - config/evaluation_rules/

# 生命周期字段由 Runtime CAS 在验证合法工作流迁移后统一提交；不属于任何角色的业务字段权限。
lifecycle_authority:
  owner: runtime_cas
  fields:
    - status
    - next_role
    - active_module
    - active_change_request

field_ownership:
  runtime_orchestrator:
    - runtime
  change_request:
    - change_cycle
    - change_context
    - current_iteration
    - automatic_retry_allowed
    - change_request_record
  first_ask_intake:
    - requirements_status
    - requirements_version
    - active_requirements
    - active_interview
    - intake_round
    - reference_status
    - requirements_discovery_status
    - research_status
    - intent_analysis_ref
    - research_requirement_ref
    - active_research_round
    - coverage_map_ref
    - gap_analysis_ref
    - question_set_ref
    - sufficiency_evaluation_ref
  domain_research:
    - requirements_discovery_status
    - research_status
    - active_research_round
    - opportunity_map_ref
  reference_analysis:
    - reference_analysis_status
    - active_reference_synthesis
  planner:
    - proposal_status
    - proposal_version
    - active_proposal
    - approved_proposal
    - design_exploration_required
    - exploration_trigger_reasons
    - design_review_status
    - design_preview_mode
    - design_preview_round
    - active_design_preview_round
    - exploration_generation_attempt
    - exploration_error_record
    - selected_design_concept
    - design_selection_record
    - design_skip_record
    - design_feedback_status
    - design_feedback_round
    - exploration_feedback_record
    - active_design_reference_synthesis
    - user_approval_status
    - product_approval_record
    - approval_artifact_hashes
    - approved_plan_hash
    - approval_revocation_record
    - change_request_record
    - product_spec_status
    - product_spec_version
    - active_product_spec
    - plan_status
    - plan_version
    - active_plan
    - approved_plan
    - plan_approval_status
    - plan_approval_record
    - change_impact_analysis
    - change_approval_record
    - approved_change_items
  evaluator:
    - change_context
    - current_iteration
    - last_evaluation
    - evidence_manifest
    - last_issue_package
    - iteration_metrics
    - retry_history
    - routing_disagreements
    - escalation_record
    - automatic_retry_allowed
    - iteration_sequence
    - release_version
    - current_release
    - blocked_reason
  generator:
    - last_generator_response
    - change_baseline

# F8.5：外部目标只在 schema_version=5、project_type=skill_maintenance 时有效。
# 实际路径授权由 scripts/skill_maintenance.py 强制执行，不能仅依赖 Prompt。
skill_maintenance:
  planner:
    external_targets:
      - working_repository
      - installed_repository
    external_write_targets: []
  generator:
    external_targets:
      - working_repository
    external_write_targets:
      - working_repository
  evaluator:
    external_targets:
      - working_repository
      - installed_repository
    external_write_targets: []
