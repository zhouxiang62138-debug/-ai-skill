version: 1
database:
  relative_path: .runtime/sessions.sqlite3
  foreign_keys: true
  journal_mode: WAL
  busy_timeout_ms: 5000
events:
  payload_limit_bytes: 65536
leases:
  default_ttl_seconds: 30
  require_before_state_commit: true
project_state:
  schema_version: 7
  compare_and_swap: true
  legacy_first_read_is_read_only: true
