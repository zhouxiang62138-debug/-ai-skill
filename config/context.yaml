version: 1
default: deny

# F13.1/F13.2：描述资料选择与字节预算，不重复定义 Role 的路径权限。
roles:
  planner:
    max_context_bytes: 262144
    max_inline_bytes: 196608
    max_sources: 32
    max_source_inline_bytes: 65536
    sources:
      - source_type: project_state
        reference: project.yaml
        reason: 当前 managed project 状态
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: active_requirements
        reason: 已确认的需求快照
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: active_proposal
        reason: 当前产品方案
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: approved_proposal
        reason: 历史批准的产品方案
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: product_approval_record
        reason: 产品确认记录
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: active_product_spec
        reason: 当前正式产品规格
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: active_plan
        reason: 当前开发计划
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: approved_plan
        reason: 原始已批准 Plan 与当前变更基线
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: last_evaluation
        reason: 原项目既有验收历史
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: current_release
        reason: 当前已接受实现的 Release 指针
        priority: NORMAL
        delivery_mode: REFERENCE
      - source_type: state_reference
        field: design_selection_record
        reason: 设计选择记录
        priority: NORMAL
        delivery_mode: INLINE
      - source_type: state_reference
        field: design_skip_record
        reason: 设计跳过记录
        priority: NORMAL
        delivery_mode: INLINE
      - source_type: state_reference
        field: exploration_feedback_record
        reason: 设计探索反馈
        priority: NORMAL
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_request_record
        reason: 当前 Change Request 记录
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_impact_analysis
        reason: Change Request 影响分析
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_approval_record
        reason: Change Request 批准记录
        priority: HIGH
        delivery_mode: INLINE
  generator:
    max_context_bytes: 393216
    max_inline_bytes: 262144
    max_sources: 64
    max_source_inline_bytes: 131072
    sources:
      - source_type: project_state
        reference: project.yaml
        reason: 当前 managed project 状态
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: approved_plan
        reason: 唯一可执行的批准计划
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: active_product_spec
        reason: 当前正式产品规格
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: last_issue_package
        reason: 最新可执行 Evaluator issue package
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: last_generator_response
        reason: 当前实现交接记录
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_request_record
        reason: 当前已批准 Change Request
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_approval_record
        reason: 当前变更范围批准记录
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_baseline
        reason: 变更实现稳定基线
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: current_release
        reason: 原项目 Release 基线
        priority: NORMAL
        delivery_mode: REFERENCE
      - source_type: state_reference
        field: last_evaluation
        reason: 原项目既有验收证据
        priority: HIGH
        delivery_mode: INLINE
  evaluator:
    max_context_bytes: 327680
    max_inline_bytes: 229376
    max_sources: 48
    max_source_inline_bytes: 98304
    sources:
      - source_type: project_state
        reference: project.yaml
        reason: 当前 managed project 状态
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: approved_plan
        reason: 批准计划与验收范围
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: active_product_spec
        reason: 当前正式产品规格与验收标准
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: last_generator_response
        reason: Generator 交接记录
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: last_evaluation
        reason: 上一轮相关验收记录
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: last_issue_package
        reason: 当前 issue package
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: evidence_manifest
        reason: 可复现验证证据
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_request_record
        reason: 当前已批准 Change Request
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_approval_record
        reason: 当前变更范围批准记录
        priority: REQUIRED
        delivery_mode: INLINE
      - source_type: state_reference
        field: change_baseline
        reason: 变更实现稳定基线
        priority: HIGH
        delivery_mode: INLINE
      - source_type: state_reference
        field: current_release
        reason: 原项目 Release 基线
        priority: NORMAL
        delivery_mode: REFERENCE
      - source_type: state_value
        field: evaluation_profile
        reason: 当前验收 Profile
        priority: REQUIRED
        delivery_mode: INLINE
