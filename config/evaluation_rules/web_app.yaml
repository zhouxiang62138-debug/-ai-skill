profile: web_app
schema_version: 2
evaluation:
  scale:
    minimum: 0
    maximum: 10
  pass_score: 8.0
  required_checks:
    runtime: PASS
    core_functionality: PASS
  browser_validation:
    required: true
    startup_command: ["npm", "run", "dev"]
    base_url: "http://127.0.0.1:3000"
    timeout_seconds: 30
    screenshot_policy: on_failure
    console_error_policy: fail_on_error
    network_failure_policy: fail_on_failure
    required_scenarios: []
  feature_completeness:
    required: true
    minimum_score: 8.0
    required_sources: ["static", "runtime", "browser"]
  criteria:
    functionality:
      weight: 0.20
      minimum_score: 8.0
    design_quality:
      weight: 0.10
      minimum_score: 7.0
    code_quality:
      weight: 0.20
      minimum_score: 8.0
    security:
      weight: 0.10
      minimum_score: 8.0
    testing:
      weight: 0.10
      minimum_score: 7.0
    requirement_alignment:
      weight: 0.15
      minimum_score: 8.0
    user_experience:
      weight: 0.10
      minimum_score: 8.0
    maintainability:
      weight: 0.05
      minimum_score: 7.0
  evidence_required_for_required_checks: true
  pass_policy:
    maximum_allowed:
      blocker: 0
      critical: 0
  gates:
    GATE-DELIVERY:
      required: true
    GATE-BUILD:
      required: true
    GATE-TESTS:
      required: true
    GATE-REQUIREMENTS:
      required: true
    GATE-BROWSER-ACCEPTANCE:
      required: true
    GATE-FEATURE-COMPLETENESS:
      required: true
    GATE-REGRESSION:
      required: true
    GATE-NON_FUNCTIONAL:
      required: true
    GATE-EVIDENCE:
      required: true
  allowed_commands:
    - ["npm", "run", "build"]
    - ["npm", "run", "lint"]
    - ["npm", "run", "typecheck"]
    - ["npm", "test"]
  mandatory_regression_suite:
    - build
    - lint
    - typecheck
    - core_unit_tests
    - critical_acceptance_criteria
    - previously_passed_critical_requirements
  protected_paths:
    - memory/plans
    - memory/specifications
    - memory/decisions
    - config/evaluation_rules
    - config/schemas
    - tests
    - project.yaml
